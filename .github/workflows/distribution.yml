name: Prepare distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      LIBZ_SYS_STATIC: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Select native Rust
        run: rustup default stable
      - name: Test
        run: |
          python3 scripts/test_distribution.py
          cargo fmt --all -- --check
          cargo test --locked --workspace --all-targets --features git2/vendored-libgit2,git2/vendored-openssl
      - name: Build and check package
        run: python3 scripts/distribution.py build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memoria-${{ matrix.runner }}
          path: dist/releases/*
          if-no-files-found: error

  formula:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: memoria-*
          path: dist/releases
          merge-multiple: true
      - name: Generate Homebrew formula
        run: python3 scripts/distribution.py formula
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homebrew-tap
          path: dist/homebrew-tap/Formula/memoria.rb
          if-no-files-found: error
