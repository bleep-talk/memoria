spec: rms/semantic-change/v0.1
module: modules/batch-recovery-decisions/implementation.yaml
supersedes:
- verification/changes/replace-every-generic-scaffold-command-and-result-with-the-approved-memoria-pure-validation-rendering-batch-planning-and-4805e5ca5339.yaml
intent:
  summary: Align Memoria contract observations with the typed reply and rejection channels. Preserve all approved behavior and internal Cargo identities.
declaration: null
laws:
  add: []
  set:
  - id: memoria-pure-reuse
    statement: |
      Every public operation is a total pure function over explicit values.
      Equal state and input produce equal state, reply, rejection, and record.
      No filesystem, Git, clock, environment, network, random-source, executor,
      or native driver access is reachable from the public facade.
      Arithmetic is checked or bounded. Invalid values return typed errors.
      One src/lib.rs facade exposes the reusable domain package.
      Native package metadata and dependencies must match the implementation binding.
    kind: safety
    authority: transition
    enforced_by: transition-model
  remove: []
contracts:
  add: []
  set:
  - name: resolve-batch-recovery-capability
    kind: capability
    direction: provided
    version: '1'
    command: null
    meaning: |
      Reusable Memoria pure capability for path and Policy validation,
      Markdown validation, working-file context and tree projection,
      guarded batch planning, and recovery decisions from explicit observations.
