    ensures: []
    rejects: []
    semantics:
      behavior:
        observability: full
        observations:
        - id: outcome-MemoryDecision
          source:
            kind: output
            output_kind: reply
            name: MemoryDecision
          value: occurrence
        - id: outcome-BatchPlan
          source:
            kind: output
            output_kind: reply
            name: BatchPlan
          value: occurrence
        - id: outcome-BatchSettled
          source:
            kind: output
