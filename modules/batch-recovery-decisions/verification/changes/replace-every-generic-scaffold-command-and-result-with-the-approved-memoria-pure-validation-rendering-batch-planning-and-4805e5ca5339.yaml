                observation: decision-kind
              right:
                literal: BatchPlan
          outcome:
            kind: accepted
            expression:
              equals:
                left:
                  observation: decision-kind
                right:
                  literal: BatchPlan
          ensures: []
          permits:
            state_changes:
            - /state
            events: []
