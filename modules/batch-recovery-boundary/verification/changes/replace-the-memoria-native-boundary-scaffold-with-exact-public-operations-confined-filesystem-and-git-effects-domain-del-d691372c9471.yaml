spec: rms/semantic-change/v0.1
module: modules/batch-recovery-boundary/implementation.yaml
supersedes:
- verification/changes/declare-memoria-native-integration-test-roles-before-binding-their-executable-evidence-a0e8ba9f0082.yaml
intent:
  summary: Replace the Memoria native-boundary scaffold with exact public operations, confined filesystem and Git effects, domain delegation, recoverable batches and a thin memoria CLI. Preserve the existing internal exported command batch-recovery. Add the public memoria-memory library capability. Canonical declarations precede source implementation.
declaration:
  purpose: Expose Memoria MemoryRepo through one native Rust facade and a thin CLI. Execute repository effects under host policy and delegate pure product decisions to the required recovery capability.
  owns:
    concepts:
    - MemoryRepo native facade
    - untrusted library and CLI request
    - repository effect observation
    - cooperating-call repository lock
    - durable recovery journal
    - Git publication observation
    data:
    - repository handles
    - lock handles
    - bounded journal records
    - effect observations
    - transition records
    - versioned CLI output envelopes
    decisions:
    - input syntax parsing
    - effect observation classification
    - effect scheduling from canonical transitions
    - durable filesystem execution
    - Git publication reconciliation
    - CLI output encoding
  effects:
  - name: AcquireRepoLock
    kind: filesystem
    capability: null
    semantics: null
  - name: InspectRepository
    kind: filesystem
    capability: null
    semantics: null
  - name: InspectJournal
    kind: filesystem
    capability: null
    semantics: null
  - name: RollbackJournal
    kind: filesystem
    capability: null
    semantics: null
  - name: CleanupJournal
    kind: filesystem
    capability: null
    semantics: null
  - name: ReadSnapshot
    kind: filesystem
    capability: null
    semantics: null
  - name: PersistJournal
    kind: filesystem
    capability: null
    semantics: null
  - name: ApplyFilesystemPlan
    kind: filesystem
    capability: null
    semantics: null
  - name: PersistCompletion
    kind: filesystem
    capability: null
    semantics: null
  - name: InspectGit
    kind: local-process
    capability: null
    semantics: null
  - name: PublishCommit
    kind: local-process
    capability: null
    semantics: null
  - name: ReconcileCommit
    kind: local-process
    capability: null
    semantics: null
  - name: ReleaseRepoLock
    kind: filesystem
    capability: null
    semantics: null
  - name: cli-io
    kind: local-ui
    capability: null
    semantics: null
  boundary:
    trust_boundary: native-repository-and-cli
    inputs:
    - untrusted library operation arguments
    - untrusted CLI arguments and JSON
    - host-supplied immutable policy
    - filesystem and journal observations
    - Git repository and reference observations
    outputs:
    - typed MemoryRepo results and errors
    - versioned JSON CLI results and errors
    - bounded filesystem mutations
    - separately requested local Git commits
    validation:
    - Parse library and CLI inputs before acquiring mutation authority.
    - Delegate product validation to the exact required provider.
    - Accept policy only from the host; expose no CLI policy override.
    - Reject unsupported repository forms and unsafe managed paths.
    - Validate a complete requested mutation before writing its journal.
    - Treat effect results as typed observations, never as permission to skip a phase.
  remove_boundary: false
  remove_scaffold: true
  no_untrusted_boundary_justification: null
laws:
  add:
  - id: parsed-host-policy
    statement: Every public request is parsed into a closed operation envelope or a typed invalid-input rejection. CLI input never changes host policy.
    kind: safety
    authority: parser
    enforced_by: parse-memory-request
  - id: canonical-effect-order
    statement: One pure transition owns each outcome-dependent phase. The driver executes only recorded effects and feeds one correlated typed result back per request. Illegal state/input combinations cannot cause effects or advance state.
    kind: safety
    authority: transition
    enforced_by: transition-model
  - id: confined-serialized-storage
    statement: Repository effects use fd-relative no-follow operations beneath the exact four provider-declared conventional roots. Managed entries are directories or regular files. Symlinks, special files, bare repositories, linked worktrees, and submodules are rejected. One lock serializes cooperating calls through recovery and completion.
    kind: safety
    authority: effect-executor
    enforced_by: filesystem-support
  - id: bounded-durable-recovery
    statement: Provider validation and optimistic expected-hash checks precede requested writes. Journal entry count, encoded bytes, backup bytes, and mutation bytes obey checked host limits. Durable journal precedes apply; durable completion precedes success. Incomplete journals roll back and complete journals clean up. Unexpected external edits cause RecoveryConflict without destructive recovery.
    kind: safety
    authority: transition
    enforced_by: transition-model
  - id: fenced-git-publication
    statement: Commit is separate from filesystem apply. Pre-existing staged changes reject commit. Publication fences expected HEAD, including unborn HEAD, and uncertain publication is reconciled against the intended commit and reference identity. No checkout, hook execution, or networking occurs.
    kind: safety
    authority: transition
    enforced_by: transition-model
  - id: reusable-native-facade
    statement: All fifteen operations are available through one native MemoryRepo facade. The memoria CLI calls that facade and emits stable versioned JSON results and errors. Native package consumers need no CLI internals.
    kind: safety
    authority: transition
    enforced_by: transition-model
  set: []
  remove: []
contracts:
  add:
  - name: memoria-memory
    kind: capability
    direction: provided
    version: '1'
    command: null
    meaning: Native MemoryRepo operations init, open, read, write, delete, exists, list, read_metadata, apply, build_context, tree, status, diff, commit, and log. All operations use host policy and one cooperating-call repository lock. Write, delete, and apply use optimistic expected hashes and a bounded durable journal. Commit is a separate fenced local Git operation.
    accepts: []
    ensures: []
    rejects: []
    semantics:
      behavior:
        observability: full
        observations:
        - id: outcome-kind
          source:
            kind: output
            pointer: /kind
          value:
            variant:
            - accepted
            - invalid-request
            - operation-error
        assumptions:
        - id: host-policy-and-storage
          statement: The host supplies policy and root authority. Successful durability observations require the filesystem to honor the declared flush operations. Advisory locking coordinates cooperating calls only; an external writer can still cause a conflict.
          evaluation:
            kind: external
            property: repository-effect-safety
        requires:
        - id: parse-and-policy-check
          statement: The boundary checks operation syntax, limits, repository form, managed-path membership, and required expected values before admitting a requested operation. The CLI cannot override policy.
          evaluation:
            kind: external
            property: generated-request-validation
        guarantees:
        - id: complete-native-operation-set
          statement: The facade exposes exactly the fifteen named operations. Reads, metadata, listings, context, tree, status, diff, and log observe a locked repository snapshot after recovery. Init establishes a supported repository; open validates and recovers one. Neither operation reports success before required durability is observed.
          evaluation:
            kind: external
            property: public-operation-routing
        - id: provider-owned-decisions
          statement: Pure validation, rendering, expected-hash checks, and recovery decisions use the bound provider. The boundary supplies typed observations and does not duplicate those rules.
          evaluation:
            kind: external
            property: provider-decision-routing
        - id: durable-batch-and-recovery
          statement: Complete validation precedes a requested mutation. A bounded journal is durable before apply. Completion is durable before success. Recovery rolls back incomplete journals and cleans complete journals. Unexpected external edits produce RecoveryConflict without overwriting the conflicting content.
          evaluation:
            kind: external
            property: crash-and-failure-schedules
        - id: separate-fenced-commit
          statement: Only commit publishes a Git commit. It rejects pre-existing staged changes, checks the expected HEAD, uses a conditional reference update, and reconciles uncertain publication before reporting success.
          evaluation:
            kind: external
            property: commit-publication-schedules
        - id: importable-library
          statement: A separate Cargo consumer imports memoria-memory through the public MemoryRepo facade. The nested memoria CLI calls that same facade.
          evaluation:
            kind: external
            property: external-consumer-and-cli
        failures:
        - id: invalid-input-result
          statement: Invalid syntax or an invalid operation envelope returns InvalidRequest with no repository effects.
          evaluation:
            kind: external
            property: generated-request-validation
        - id: typed-operation-error
          statement: Operational errors include PolicyViolation, UnsupportedRepository, UnsafePath, NotFound, AlreadyExists, ExpectedHashMismatch, JournalLimitExceeded, InvalidJournal, LockUnavailable, IoError, RecoveryRequired, RecoveryConflict, StagedChanges, HeadMismatch, PublicationConflict, PublicationUnknown, and IllegalTransition. Errors disclose whether recovery or publication reconciliation remains necessary. No failed durability or unknown publication becomes success.
          evaluation:
            kind: external
            property: crash-and-failure-schedules
        cases:
        - id: operation-accepted
          statement: The operation returns its typed result after its required phases.
          when:
            equals:
              left:
                observation: outcome-kind
              right:
                literal: accepted
          outcome:
            kind: accepted
            expression:
              equals:
                left:
                  observation: outcome-kind
                right:
                  literal: accepted
          ensures: []
          permits:
            state_changes:
            - /repository
            - /journal
            - /git
            - /resources
            events: []
            effects:
            - AcquireRepoLock
            - InspectRepository
            - InspectJournal
            - RollbackJournal
            - CleanupJournal
            - ReadSnapshot
            - PersistJournal
            - ApplyFilesystemPlan
            - PersistCompletion
            - InspectGit
            - PublishCommit
            - ReconcileCommit
            - ReleaseRepoLock
            - cli-io
        - id: request-invalid
          statement: Invalid boundary input is rejected before repository effects.
          when:
            equals:
              left:
                observation: outcome-kind
              right:
                literal: invalid-request
          outcome:
            kind: rejected
            category: invalid-request
            expression:
              equals:
                left:
                  observation: outcome-kind
                right:
                  literal: invalid-request
          ensures: []
          permits:
            state_changes: []
            events: []
            effects: []
        - id: operation-error
          statement: An admitted operation returns a typed error. Recovery work or a partially applied journal can exist; the error does not claim a no-mutation outcome.
          when:
            equals:
              left:
                observation: outcome-kind
              right:
                literal: operation-error
          outcome:
            kind: rejected
            category: operation-error
            expression:
              equals:
                left:
                  observation: outcome-kind
                right:
                  literal: operation-error
          ensures: []
          permits:
            state_changes:
            - /repository
            - /journal
            - /git
            - /resources
            events: []
            effects:
            - AcquireRepoLock
            - InspectRepository
            - InspectJournal
            - RollbackJournal
            - CleanupJournal
            - ReadSnapshot
            - PersistJournal
            - ApplyFilesystemPlan
            - PersistCompletion
            - InspectGit
            - PublishCommit
            - ReconcileCommit
            - ReleaseRepoLock
            - cli-io
        invariants: []
        case_policy:
          coverage: exhaustive
          overlap: forbidden
    protocol: null
  set:
  - name: resolve-batch-recovery-capability
    kind: capability
    direction: required
    version: '1'
    command: null
    meaning: null
    accepts: []
    ensures: []
