    - Spawn two real processes; thread-only tests do not satisfy this property.
    - Use barriers to overlap lock acquisition, expected-hash validation, apply, recovery, and commit.
    - Two writes with the same expected hash cannot both report successful conflicting updates.
    - A read cannot observe a cooperating writer's partially applied batch.
    - Killing a lock owner releases the OS lock and the next process recovers its incomplete journal before continuing.
