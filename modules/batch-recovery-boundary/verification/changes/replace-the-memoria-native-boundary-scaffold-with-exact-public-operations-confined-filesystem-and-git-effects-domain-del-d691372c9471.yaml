properties:
  add:
  - id: generated-request-validation
    proves: parsed-host-policy
    kind: fuzz
    subject: null
    input_space:
      strategy: generated
      generator: memory-request-generator
    preconditions: []
    operation:
      kind: semantic-function
      name: parse-memory-request
    oracle:
    - Generate raw library envelopes, CLI arguments, malformed JSON, missing fields, unknown operations, oversized values, and unexpected policy options.
    - Parsing is total and returns a closed request or InvalidRequest; it never panics or performs IO.
    - Reject invalid syntax before domain delegation and before repository effects.
    - Host policy remains identical after every CLI input.
    - Include traversal, absolute paths, embedded NUL, non-UTF8 OS arguments, duplicate fields, invalid hashes, integer overflow, and limit boundaries.
    - Replay each saved counterexample using the same parser and oracle.
    evidence:
      kind: fuzz
      path: verification/properties/request_validation
    counterexamples:
      path: verification/counterexamples/request_validation
    realizations:
    - profile: smoke
      strategy: generated-property
      command: fuzz
      generator: tests/properties.rs#generate_requests
      runner: tests/properties.rs#check_request_validation
      exhaustive: false
      owner_module: null
      package: null
      working_directory: null
      test_selection: null
    explorations: []
    observations: []
    observability: null
    assumptions: []
    temporal: null
  - id: phase-protocol
    proves: canonical-effect-order
    kind: semantic
    subject: null
    input_space:
      strategy: generated
      generator: memory-phase-schedule-generator
    preconditions: []
    operation:
      kind: semantic-function
      name: transition-model
    oracle:
    - Generate valid, illegal, stale, duplicate, delayed, and mismatched-correlation inputs across every declared state.
    - Every legal input selects exactly one case; every other state/input pair returns IllegalTransition with unchanged state and empty effect output.
    - Discriminate same-state same-input cases using typed observations and provider decisions, never executor-owned business branches.
    - Record state before, input, complete output, state after, and source provenance for every transition.
    - The driver retains every complete record, advances from state_after, executes only output.effects, and feeds each correlated result into the pure transition.
    - A rejected unrelated input cannot discard an in-flight request or release its resources.
    - LockReleaseError is emitted only after the executor closes the owned lock descriptor; an earlier unlock failure cannot falsely report an unheld resource.
    - Recovery after interrupted apply retains the original failure; after recovery the request returns an error and is not silently retried or converted into success.
    - No finite operation path returns with an owned lock; process death releases its OS lock without marking its journal complete.
    evidence:
      kind: property
      path: verification/properties/phase_protocol
    counterexamples:
      path: verification/counterexamples/phase_protocol
    realizations:
    - profile: smoke
      strategy: generated-property
      command: fuzz
      generator: tests/properties.rs#generate_phase_schedules
      runner: tests/properties.rs#check_phase_protocol
      exhaustive: false
      owner_module: null
      package: null
      working_directory: null
      test_selection: null
    explorations: []
    observations: []
    observability: null
    assumptions: []
    temporal: null
  - id: provider-decision-routing
    proves: canonical-effect-order
    kind: semantic
    subject: null
    input_space:
      strategy: generated
      generator: provider-observation-generator
    preconditions:
    - The provider has applied product semantics and the required contract is synced byte-for-byte.
    operation:
      kind: semantic-function
      name: transition-model
    oracle:
    - Every product validation, expected-hash comparison, context/tree rendering, and recovery decision is obtained from the exact bound capability.
    - Compare provider results and boundary transition outputs for generated observations and requests.
    - The provider receives immutable typed observations and performs no filesystem or Git IO.
    - The boundary cannot accept a request rejected by the provider or invent conventional root names.
    evidence:
      kind: property
      path: verification/properties/provider_routing
    counterexamples:
      path: verification/counterexamples/provider_routing
    realizations:
    - profile: smoke
      strategy: generated-property
      command: fuzz
      generator: tests/properties.rs#generate_provider_observations
      runner: tests/properties.rs#check_provider_routing
      exhaustive: false
      owner_module: null
      package: null
      working_directory: null
      test_selection: null
    explorations: []
    observations: []
    observability: null
    assumptions: []
    temporal: null
  - id: repository-effect-safety
    proves: confined-serialized-storage
    kind: semantic
    subject: null
    input_space:
      strategy: generated
      generator: filesystem-topology-generator
    preconditions:
    - The host supplies a trusted repository anchor, fixed provider roots, and bounded policy.
    operation:
      kind: semantic-function
      name: filesystem-support
    oracle:
    - Generate regular files, directories, symlinks at every path component, special files, missing parents, replacement races, and malformed repositories.
    - Resolve and mutate through retained directory descriptors with no-follow checks; never validate a path and later reopen it by unchecked absolute spelling.
    - No managed operation escapes the four fixed roots or follows a symlink.
    - Internal lock, journal, and Git metadata are reserved control storage and cannot be addressed as managed memory paths.
    - Reject bare repositories, linked worktrees, and submodules before requested mutation.
    - Read paths do not accept special files or block on FIFO/device input.
    - Init coordinates through the trusted anchor even before repository creation and journals managed-root creation.
    - Required file and parent-directory durability steps are observable; unsupported durability or no-follow behavior fails closed.
    - Document the limit that advisory locks do not make arbitrary hostile external writers participate in serialization.
    evidence:
      kind: property
      path: verification/properties/filesystem_safety
    counterexamples:
      path: verification/counterexamples/filesystem_safety
    realizations:
    - profile: smoke
      strategy: generated-property
      command: fuzz
      generator: tests/properties.rs#generate_filesystem_topologies
      runner: tests/properties.rs#check_filesystem_safety
      exhaustive: false
      owner_module: null
      package: null
      working_directory: null
      test_selection: null
    explorations: []
    observations: []
    observability: null
    assumptions: []
    temporal: null
  - id: crash-and-failure-schedules
    proves: bounded-durable-recovery
    kind: semantic
    subject: null
    input_space:
      strategy: generated
      generator: journal-crash-schedule-generator
    preconditions:
    - The provider recovery contract has product semantics.
    operation:
      kind: semantic-function
      name: transition-model
    oracle:
    - Generate batches, absent/present expected hashes, duplicate paths, ancestor collisions, deletion cases, empty batches, and all host-limit boundaries.
    - Validate the whole batch against the locked snapshot before persisting its journal.
    - Journal schema version 1 records repository identity, transaction identity, bounded entries, before/after hashes, recovery data, and completion state.
    - Bound decoding, allocation, entry count, backup bytes, and total encoded bytes with checked arithmetic.
    - Inject short writes, interruption, disk-full errors, failed flushes, rename failures, cleanup failures, and crashes before and after each durable step.
    - A partial journal that has not enabled apply cannot authorize rollback of arbitrary paths.
    - An incomplete journal restores the pre-apply state when observed files match permitted before/after states.
    - Recovery rechecks each destination before mutation and preserves unexpected content with RecoveryConflict.
    - Repeated crashes during rollback or cleanup remain recoverable and do not erase conflict evidence.
    - A complete durable journal is cleaned without rolling back its committed filesystem state.
    - No apply effect precedes JournalDurable and no successful mutation reply precedes CompletionDurable.
    - A failed apply is never automatically replayed as a new user request.
    - Errors retain the original operation failure and report pending recovery or cleanup when applicable.
    evidence:
      kind: property
      path: verification/properties/crash_recovery
    counterexamples:
      path: verification/counterexamples/crash_recovery
    realizations:
    - profile: smoke
      strategy: generated-property
      command: fuzz
      generator: tests/properties.rs#generate_crash_schedules
      runner: tests/properties.rs#check_crash_recovery
      exhaustive: false
      owner_module: null
      package: null
      working_directory: null
      test_selection: null
    - profile: ci
      strategy: integration-test
      command: integration
      generator: null
      runner: modules/batch-recovery-boundary/tests/concurrency.rs#crash_restart_recovers
      exhaustive: false
      owner_module: batch-recovery-boundary
      package: batch-recovery-boundary
      working_directory: modules/batch-recovery-boundary
      test_selection: crash_restart_recovers
    explorations: []
    observations: []
    observability: null
    assumptions: []
    temporal: null
  - id: commit-publication-schedules
    proves: fenced-git-publication
    kind: semantic
    subject: null
    input_space:
      strategy: generated
      generator: git-publication-schedule-generator
    preconditions: []
    operation:
      kind: semantic-function
      name: transition-model
    oracle:
    - Generate born and unborn HEAD, staged changes, clean index, expected-HEAD mismatch, reference replacement, and publication failures.
    - Write, delete, apply, init, and open never publish commits.
    - Status, diff, and log are read operations and do not stage, checkout, or publish.
    - Commit rejects pre-existing staged changes before preparing its own publication.
    - Prepare commit content without modifying the caller's index and limit committed changes to provider-approved managed content.
    - Conditional reference publication checks both the intended reference identity and expected old HEAD at publication time.
    - Retain expected HEAD, target reference, intended commit identity, and enough bounded durable reconciliation data to reopen after uncertain publication.
    - Reconcile an unknown update by observing the target reference; intended commit means published, expected old value means not published, and another value means PublicationConflict.
    - An unreadable publication state returns PublicationUnknown and never retries a blind reference update.
    - Inject crash and IO failure around object durability, reference update, publication observation, and reconciliation cleanup.
    - No code path invokes hooks, checkout, network transport, or a Git subprocess.
    evidence:
      kind: property
      path: verification/properties/git_publication
    counterexamples:
      path: verification/counterexamples/git_publication
