  - id: real-process-serialization
    proves: confined-serialized-storage
    kind: semantic
    subject: null
    input_space:
      strategy: generated
      generator: two-process-operation-schedules
    preconditions:
    - Two independent OS processes use the same repository and host policy.
    operation:
      kind: semantic-function
      name: memory-repo-facade
    oracle:
    - Spawn two real processes; thread-only tests do not satisfy this property.
    - Use barriers to overlap lock acquisition, expected-hash validation, apply, recovery, and commit.
    - Two writes with the same expected hash cannot both report successful conflicting updates.
    - A read cannot observe a cooperating writer's partially applied batch.
    - Killing a lock owner releases the OS lock and the next process recovers its incomplete journal before continuing.
    - Distinct path spellings for the same supported repository resolve to the same lock identity.
    - An external noncooperating edit is preserved and reported as RecoveryConflict when recovery encounters it.
    - Record the selected test count and child exit results.
    evidence:
      kind: property
      path: verification/properties/process_concurrency
    counterexamples:
      path: verification/counterexamples/process_concurrency
    realizations:
    - profile: ci
      strategy: integration-test
      command: integration
      generator: null
