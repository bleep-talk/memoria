  - id: crash-and-failure-schedules
    proves: bounded-durable-recovery
    kind: semantic
    subject: null
    input_space:
      strategy: generated
      generator: journal-crash-schedule-generator
    preconditions:
    - The provider recovery contract has product semantics.
    operation:
      kind: semantic-function
      name: transition-model
    oracle:
    - Generate batches, absent/present expected hashes, duplicate paths, ancestor collisions, deletion cases, empty batches, and all host-limit boundaries.
    - Validate the whole batch against the locked snapshot before persisting its journal.
    - Journal schema version 1 records repository identity, transaction identity, bounded entries, before/after hashes, recovery data, and completion state.
    - Bound decoding, allocation, entry count, backup bytes, and total encoded bytes with checked arithmetic.
    - Inject short writes, interruption, disk-full errors, failed flushes, rename failures, cleanup failures, and crashes before and after each durable step.
    - A partial journal that has not enabled apply cannot authorize rollback of arbitrary paths.
    - An incomplete journal restores the pre-apply state when observed files match permitted before/after states.
    - Recovery rechecks each destination before mutation and preserves unexpected content with RecoveryConflict.
    - Repeated crashes during rollback or cleanup remain recoverable and do not erase conflict evidence.
    - A complete durable journal is cleaned without rolling back its committed filesystem state.
    - No apply effect precedes JournalDurable and no successful mutation reply precedes CompletionDurable.
    - A failed apply is never automatically replayed as a new user request.
    - Errors retain the original operation failure and report pending recovery or cleanup when applicable.
    evidence:
      kind: property
      path: verification/properties/crash_recovery
    counterexamples:
      path: verification/counterexamples/crash_recovery
