  - id: external-consumer-and-cli
    proves: reusable-native-facade
    kind: semantic
    subject: null
    input_space:
      strategy: generated
      generator: package-and-cli-request-cases
    preconditions: []
    operation:
      kind: semantic-function
      name: memory-repo-facade
    oracle:
    - Create an independent temporary Cargo consumer outside the library workspace and import the public memoria-memory package.
    - Compile and exercise MemoryRepo through src/lib.rs exports without private source imports or CLI dependencies.
    - Build the separate nested CLI crate and verify that its binary is named memoria.
    - Run CLI cases for all operations and compare results with direct library calls.
    - Every CLI response uses schema_version 1 and a stable accepted, invalid-request, or operation-error envelope.
    - Errors expose stable codes and typed details; error messages are not parsed as the protocol.
    - JSON stdout contains exactly one response; diagnostic stderr does not contaminate it.
    - Invalid UTF8 arguments, malformed JSON, broken output pipes, unknown commands, and oversized input receive defined nonpanic handling.
    - No CLI option overrides host policy or enables checkout, hooks, networking, bare repositories, worktrees, or submodules.
    - Project just recipes invoke native Rust commands and selector recipes select at least one exact test rather than silently running zero tests.
    evidence:
      kind: property
      path: verification/properties/external_consumer
    counterexamples:
