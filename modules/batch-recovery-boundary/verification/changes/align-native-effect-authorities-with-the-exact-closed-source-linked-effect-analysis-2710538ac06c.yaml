  - id: filesystem
    kind: privileged
    capabilities:
    - native-filesystem-operations
    rationale: Native directory-relative operations and lock release perform filesystem effects outside the initial confined-open facade.
  - id: environment
    kind: privileged
    capabilities:
    - read-process-environment
    rationale: The declared crash-injection hook reads a process environment variable at native journal points.
  - id: process
    kind: privileged
    capabilities:
    - terminate-process-for-fault-injection
    rationale: The declared crash-injection hook can terminate the process at selected journal points.
  - id: randomness
    kind: privileged
    capabilities:
    - generate-random-identifier
    rationale: Repository identity and temporary replacement names use UUIDv4 randomness.
  - id: git
    kind: foreign
    capabilities:
    - git2-native-calls
    rationale: Git inspection and publication call the pinned native git2 library.
